# Generic oc-mirror Policy (inform) + hub-only Placement + PlacementBinding.
# Placeholders (UPPER_CASE) are replaced by components/params from the overlay's params.env:
#   RUN_NAME        -> Policy, PlacementBinding, Job, PVC, ISC ConfigMap names
#   NAMESPACE       -> where SA/PVC/Job/ISC ConfigMap are created on the hub (e.g. cwl3-sno)
#   AUTH_SECRET     -> existing pull secret (source + destination auths) in NAMESPACE
#   OC_MIRROR_IMAGE -> oc-mirror image (e.g. the "oc-mirror" component of a release payload)
#   MIRROR_REGISTRY / MIRROR_PREFIX / DEST_TLS_VERIFY -> Job env, used in the oc-mirror command
#   PVC_SIZE        -> workspace PVC size
# Integer fields (backoffLimit, activeDeadlineSeconds) are overridden with overlay patches.
#
# Compliant == the Job has succeeded (status.succeeded is compared, never written), so the
# CGU completes only once the mirror finished.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: RUN_NAME
  namespace: ztp-oc-mirror
  labels:
    oc-mirror.ngc747/stage: "02"
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/description: >-
      Run oc-mirror v2 (mirrorToMirror) on the hub with the ImageSetConfiguration held in
      ConfigMap <NAMESPACE>/<RUN_NAME>, pushing to <MIRROR_REGISTRY>/<MIRROR_PREFIX>.
spec:
  disabled: false
  remediationAction: inform
  policy-templates:
    # The Policy READS the ISC ConfigMap through fromConfigMap (pod annotation below):
    #  - ConfigMap missing -> template error, NonCompliant, no Job created
    #  - ISC edited later  -> annotation differs from the immutable Job -> NonCompliant
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: oc-mirror-run
        spec:
          remediationAction: inform
          severity: medium
          pruneObjectBehavior: None
          object-templates:
            # [0] ServiceAccount (shared by all runs in NAMESPACE)
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: oc-mirror
                  namespace: NAMESPACE
                  labels:
                    app.kubernetes.io/part-of: oc-mirror-cgu
            # [1] workspace PVC (one per run). mirrorToMirror stores no image blobs here:
            #     a release-only run used 165M; catalogs add ~0.3-1G each.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: PersistentVolumeClaim
                metadata:
                  name: RUN_NAME
                  namespace: NAMESPACE
                  labels:
                    app.kubernetes.io/part-of: oc-mirror-cgu
                spec:
                  accessModes: [ReadWriteOnce]
                  storageClassName: csi-cephrbd
                  resources:
                    requests:
                      storage: PVC_SIZE
            # [2] the mirror Job
            - complianceType: musthave
              objectDefinition:
                apiVersion: batch/v1
                kind: Job
                metadata:
                  name: RUN_NAME
                  namespace: NAMESPACE
                  labels:
                    app.kubernetes.io/part-of: oc-mirror-cgu
                spec:
                  backoffLimit: 1
                  activeDeadlineSeconds: 10800
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/part-of: oc-mirror-cgu
                      annotations:
                        # the default SA otherwise lands on odf-blackbox-scc on this hub
                        openshift.io/required-scc: restricted-v2
                        # fingerprint of the ISC this run was created from. The two quoted
                        # arguments are replaced by NAMESPACE and RUN_NAME (delimiter '"').
                        oc-mirror.ngc747/isc-b64: '{{ fromConfigMap "NAMESPACE" "RUN_NAME" "isc.yaml" | base64enc }}'
                    spec:
                      serviceAccountName: oc-mirror
                      restartPolicy: Never
                      securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                          type: RuntimeDefault
                      containers:
                        - name: oc-mirror
                          image: OC_MIRROR_IMAGE
                          command: ["/bin/sh", "-c"]
                          args:
                            - |
                              set -u
                              echo "==== destination: docker://${MIRROR_REGISTRY}/${MIRROR_PREFIX} (dest-tls-verify=${DEST_TLS_VERIFY})"
                              /usr/bin/oc-mirror --v2 \
                                -c /config/isc.yaml \
                                --workspace file:///work/ws \
                                --cache-dir /work/cache \
                                --authfile /auth/.dockerconfigjson \
                                --dest-tls-verify="${DEST_TLS_VERIFY}" \
                                --parallel-images 4 --retry-times 5 --image-timeout 30m \
                                "docker://${MIRROR_REGISTRY}/${MIRROR_PREFIX}"
                              rc=$?
                              echo "==== oc-mirror rc=$rc"
                              echo "==== generated cluster-resources:"
                              ls -l /work/ws/working-dir/cluster-resources/ 2>/dev/null
                              for f in /work/ws/working-dir/cluster-resources/*.yaml; do
                                case "$f" in *signature-configmap*) continue;; esac
                                [ -f "$f" ] && { echo "---- $f"; cat "$f"; }
                              done
                              exit $rc
                          env:
                            - name: HOME
                              value: /work
                            - name: MIRROR_REGISTRY
                              value: MIRROR_REGISTRY
                            - name: MIRROR_PREFIX
                              value: MIRROR_PREFIX
                            - name: DEST_TLS_VERIFY
                              value: DEST_TLS_VERIFY
                          securityContext:
                            allowPrivilegeEscalation: false
                            capabilities:
                              drop: ["ALL"]
                          resources:
                            requests:
                              cpu: "1"
                              memory: 2Gi
                            limits:
                              memory: 8Gi
                          volumeMounts:
                            - name: config
                              mountPath: /config
                              readOnly: true
                            - name: auth
                              mountPath: /auth
                              readOnly: true
                            - name: work
                              mountPath: /work
                      volumes:
                        - name: config
                          configMap:
                            name: RUN_NAME
                        - name: auth
                          secret:
                            secretName: AUTH_SECRET
                        - name: work
                          persistentVolumeClaim:
                            claimName: RUN_NAME
                status:
                  succeeded: 1
---
# Hub only: name=local-cluster AND local-cluster=true. Shared by all runs (identical content).
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: oc-mirror-hub-only
  namespace: ztp-oc-mirror
  labels:
    oc-mirror.ngc747/stage: "02"
spec:
  clusterSets: [global]
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values: [local-cluster]
            - key: local-cluster
              operator: In
              values: ["true"]
---
# One binding per run (named RUN_NAME) so runs don't overwrite each other's subjects.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: RUN_NAME
  namespace: ztp-oc-mirror
  labels:
    oc-mirror.ngc747/stage: "02"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: oc-mirror-hub-only
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: RUN_NAME
