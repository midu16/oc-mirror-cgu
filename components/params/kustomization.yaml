# Reusable component: copies values from the overlay's params ConfigMap ("oc-mirror-params",
# generated from params.env and marked local-config, so it is NOT applied) into the base.
#
# RUN = spec.policy-templates.0.objectDefinition.spec.object-templates   (oc-mirror-run)
#   [0] SA  [1] PVC  [2] Job  [3] Role  [4] RoleBinding  [5] Role ingress-ca  [6] RoleBinding ingress-ca
# REP = spec.policy-templates.1.objectDefinition.spec.object-templates   (oc-mirror-report)
#   [0] results ConfigMap gate
# Order matters: NAMESPACE runs before RUN_NAME renames the ISC ConfigMap (oc-mirror-isc).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

replacements:
  # ---------------------------------------------------------------- NAMESPACE (workload)
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.NAMESPACE}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.0.objectDefinition.metadata.namespace
          - spec.policy-templates.0.objectDefinition.spec.object-templates.1.objectDefinition.metadata.namespace
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.metadata.namespace
          - spec.policy-templates.0.objectDefinition.spec.object-templates.3.objectDefinition.metadata.namespace
          - spec.policy-templates.0.objectDefinition.spec.object-templates.4.objectDefinition.metadata.namespace
          - spec.policy-templates.0.objectDefinition.spec.object-templates.4.objectDefinition.subjects.0.namespace
          - spec.policy-templates.0.objectDefinition.spec.object-templates.6.objectDefinition.subjects.0.namespace
          - spec.policy-templates.1.objectDefinition.spec.object-templates.0.objectDefinition.metadata.namespace
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.metadata.annotations.[oc-mirror.ngc747/isc-b64]
        options: {delimiter: '"', index: 1}
      - select: {kind: ConfigMap, name: oc-mirror-isc}
        fieldPaths: [metadata.namespace]
        options: {create: true}

  # ---------------------------------------------------------------- RUN_NAME
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.RUN_NAME}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - metadata.name
          - spec.policy-templates.0.objectDefinition.spec.object-templates.1.objectDefinition.metadata.name
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.metadata.name
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.volumes.[name=config].configMap.name
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.volumes.[name=work].persistentVolumeClaim.claimName
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.containers.[name=report].env.[name=RUN_NAME].value
          - spec.policy-templates.0.objectDefinition.spec.object-templates.3.objectDefinition.metadata.name
          - spec.policy-templates.0.objectDefinition.spec.object-templates.4.objectDefinition.metadata.name
          - spec.policy-templates.0.objectDefinition.spec.object-templates.4.objectDefinition.roleRef.name
          - spec.policy-templates.0.objectDefinition.spec.object-templates.6.objectDefinition.metadata.name
          - spec.policy-templates.1.objectDefinition.spec.object-templates.0.objectDefinition.data.runId
      # second quoted argument of the template strings: fromConfigMap "NS" "RUN_NAME" / printf "%s-results" "RUN_NAME"
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.metadata.annotations.[oc-mirror.ngc747/isc-b64]
          - spec.policy-templates.0.objectDefinition.spec.object-templates.3.objectDefinition.rules.1.resourceNames.0
          - spec.policy-templates.1.objectDefinition.spec.object-templates.0.objectDefinition.metadata.name
        options: {delimiter: '"', index: 3}
      - select: {kind: PlacementBinding}
        fieldPaths: [metadata.name, subjects.0.name]
      - select: {kind: ClusterGroupUpgrade}
        fieldPaths: [metadata.name, spec.managedPolicies.0]
      - select: {kind: ConfigMap, name: oc-mirror-isc}
        fieldPaths: [metadata.name]

  # ---------------------------------------------------------------- images
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.OC_MIRROR_IMAGE}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.initContainers.[name=mirror].image
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.CLI_IMAGE}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.initContainers.[name=prepare].image
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.containers.[name=report].image

  # ---------------------------------------------------------------- Job settings
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.AUTH_SECRET}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.volumes.[name=auth].secret.secretName
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.MIRROR_REGISTRY}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.initContainers.[name=mirror].env.[name=MIRROR_REGISTRY].value
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.containers.[name=report].env.[name=MIRROR_REGISTRY].value
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.MIRROR_PREFIX}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.initContainers.[name=mirror].env.[name=MIRROR_PREFIX].value
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.containers.[name=report].env.[name=MIRROR_PREFIX].value
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.DEST_TLS_VERIFY}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.initContainers.[name=mirror].env.[name=DEST_TLS_VERIFY].value
          - spec.policy-templates.0.objectDefinition.spec.object-templates.2.objectDefinition.spec.template.spec.containers.[name=report].env.[name=DEST_TLS_VERIFY].value
  - source: {kind: ConfigMap, name: oc-mirror-params, fieldPath: data.PVC_SIZE}
    targets:
      - select: {kind: Policy}
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.1.objectDefinition.spec.resources.requests.storage
